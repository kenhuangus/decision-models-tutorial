<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="50%" stop-color="#ff6a2b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff6a2b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="url(#bgGrad)" stroke="#ff6a2b" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Decision Branch Pathways (Subtle Routing Graph Lines) -->
  <path d="M12 32 H20" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44 32 H52" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 12 V20" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 44 V52" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Outer Decision Diamond with Soft Glow -->
  <polygon points="32,8 54,32 32,56 10,32" fill="url(#diamondGrad)" filter="url(#subtleGlow)"/>

  <!-- Inner Concentric Decision Token Readout Core -->
  <polygon points="32,18 45,32 32,46 19,32" fill="#0f172a" opacity="0.92"/>

  <!-- Radiant Core (Emitted Decision Token) -->
  <polygon points="32,24 39,32 32,40 25,32" fill="url(#glowGrad)"/>

  <!-- Target Decision Point (0-Decoding Symbol) -->
  <circle cx="32" cy="32" r="2.5" fill="#ff6a2b"/>
</svg>